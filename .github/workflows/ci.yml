name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-bot:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dischord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/dischord_test
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/dischord_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify models match migrations
        run: alembic check

      - name: Run pytest
        run: pytest bot/tests/ -v

  # functions/ is outside frontend/tsconfig.json, so only wrangler catches broken imports, at deploy time
  build-pages-functions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bundle Pages Functions
        run: |
          mapfile -d '' entries < <(find functions -name '*.ts' -print0)
          printf 'entry: %s\n' "${entries[@]}"
          npx --yes esbuild@0.21.5 "${entries[@]}" \
            --bundle --format=esm --platform=neutral --outdir="$RUNNER_TEMP/pages-check"
